<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>1024x768 layout check</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  iframe { display: block; width: 1024px; height: 768px; border: 0; }
</style>
</head>
<body>
<iframe id="f" src="bookshelf.html" title="1024x768 검사"></iframe>
<script>
  var p = (location.search.match(/[?&]p=([^&]+)/) || [])[1];
  if (p === "index") document.getElementById("f").src = "index.html";
</script>
</body>
</html>
