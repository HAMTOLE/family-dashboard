<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<title>우리 가족 책장</title>
<style>
  :root {
    --bg: #FBF7F0;
    --bg-1: #F6EEE2;
    --card: #FFFDF9;
    --line: #EADFCF;
    --text: #3B342C;
    --soft: #7A6F62;
    --faint: #A79A89;
    --accent: #B5794F;
    --accent-soft: #F3E3D3;
    --green: #5B7A52;
    --green-soft: #E5EEDE;
    --amber: #A2732A;
    --amber-soft: #F8EBD2;
    --red: #B4574C;
    --red-soft: #F7E1DD;
    --mom: #AC6E80;
    --mom-soft: #F7E7EA;
    --kid: #64854F;
    --kid-soft: #E7EFDE;
    --wood-1: #CE9F6B;
    --wood-2: #B07C46;
    --wood-3: #8A5C2F;
    --wood-edge: #6E4622;
    --wall: radial-gradient(120% 90% at 12% 0%, var(--bg-1) 0%, var(--bg) 62%);
    --shadow: 0 1px 2px rgba(90, 70, 45, .05), 0 8px 22px rgba(120, 95, 60, .07);
    --book-shadow: 0 5px 10px rgba(84, 58, 32, .22), 0 1px 2px rgba(60, 40, 20, .2);
    --r: 20px;
  }
  [data-theme="dark"] {
    --bg: #1B1917;
    --bg-1: #272320;
    --card: #232020;
    --line: #3A342D;
    --text: #EDE5D8;
    --soft: #B3A796;
    --faint: #8A8071;
    --accent: #DDA57C;
    --accent-soft: #3A2E24;
    --green: #A3B79A;
    --green-soft: #2B332A;
    --amber: #DDB874;
    --amber-soft: #38301F;
    --red: #DB8E82;
    --red-soft: #3B2724;
    --mom: #DDA3B1;
    --mom-soft: #382A2E;
    --kid: #A8C795;
    --kid-soft: #293327;
    --wood-1: #7A5738;
    --wood-2: #64452A;
    --wood-3: #4B331F;
    --wood-edge: #33220F;
    --wall: radial-gradient(120% 90% at 12% 0%, var(--bg-1) 0%, var(--bg) 62%);
    --shadow: 0 1px 2px rgba(0, 0, 0, .34), 0 10px 24px rgba(0, 0, 0, .3);
    --book-shadow: 0 5px 12px rgba(0, 0, 0, .45), 0 1px 2px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--wall) fixed;
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "Segoe UI", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .4s ease, color .3s ease;
  }
  button { font: inherit; color: inherit; }

  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: clamp(10px, 1.1vw, 18px);
    padding-top: max(clamp(10px, 1.1vw, 18px), env(safe-area-inset-top));
    padding-bottom: max(clamp(12px, 1.2vw, 20px), env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: clamp(7px, .85vw, 12px);
  }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; gap: clamp(7px, .9vw, 14px); flex-wrap: wrap; }
  .back {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--soft);
    border-radius: 12px;
    height: clamp(34px, 3vw, 40px);
    padding: 0 clamp(9px, .9vw, 13px);
    display: inline-flex;
    align-items: center;
    gap: .35em;
    font-size: clamp(0.8rem, .84vw, .84rem);
    font-weight: 680;
    text-decoration: none;
    box-shadow: var(--shadow);
    transition: transform .16s ease, color .2s ease, border-color .2s ease;
  }
  .back:hover { transform: translateY(-2px); color: var(--accent); border-color: var(--accent); }
  .back:active { transform: translateY(0) scale(.97); }
  h1 {
    margin: 0;
    font-size: clamp(1.3rem, 1.9vw, 1.62rem);
    font-weight: 790;
    letter-spacing: -.025em;
    line-height: 1.15;
    display: flex;
    align-items: center;
    gap: .3em;
  }
  .top .spacer { flex: 1 1 auto; }
  .filters { display: flex; gap: 5px; flex-wrap: wrap; }
  .filter {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--soft);
    font-size: clamp(0.76rem, .82vw, .8rem);
    font-weight: 720;
    padding: .42em .86em;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background-color .16s ease, color .16s ease, border-color .16s ease, transform .14s ease;
  }
  .filter:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .filter.on { background: var(--text); color: var(--card); border-color: var(--text); }
  .filter.on[data-who="mom"] { background: var(--mom-soft); color: var(--mom); border-color: var(--mom); }
  .filter.on[data-who="kid"] { background: var(--kid-soft); color: var(--kid); border-color: var(--kid); }
  .tool {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--soft);
    border-radius: 12px;
    height: clamp(34px, 3vw, 40px);
    padding: 0 clamp(9px, .9vw, 13px);
    display: inline-flex;
    align-items: center;
    gap: .4em;
    cursor: pointer;
    font-size: clamp(0.8rem, .84vw, .84rem);
    font-weight: 680;
    box-shadow: var(--shadow);
    transition: transform .16s ease, color .2s ease, border-color .2s ease;
  }
  .tool:hover { transform: translateY(-2px); color: var(--accent); border-color: var(--accent); }
  .tool:active { transform: translateY(0) scale(.97); }
  .tool .ico { font-size: 1.05em; line-height: 1; }

  /* ---------- counters ---------- */
  .counters { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: clamp(7px, .8vw, 11px); }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: clamp(8px, .85vw, 12px) clamp(10px, 1vw, 15px);
    display: flex;
    flex-direction: column;
    gap: .18em;
    min-width: 0;
    transition: background-color .3s ease, border-color .3s ease;
  }
  .stat .k {
    font-size: clamp(0.7rem, .74vw, .74rem);
    font-weight: 750;
    color: var(--faint);
    letter-spacing: .04em;
    display: flex;
    align-items: center;
    gap: .35em;
  }
  .stat .v { display: flex; align-items: baseline; gap: .3em; min-width: 0; flex-wrap: wrap; }
  .stat .n {
    font-size: clamp(1.5rem, 2vw, 1.95rem);
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--green);
  }
  .stat .n.loan { color: var(--amber); }
  .stat .n.all { color: var(--accent); }
  .stat .unit { font-size: clamp(0.78rem, .84vw, .84rem); font-weight: 720; color: var(--soft); }
  .stat .split { display: flex; gap: .45em; flex-wrap: wrap; font-size: clamp(0.7rem, .74vw, .74rem); font-weight: 700; }
  .stat .split .m { color: var(--mom); }
  .stat .split .c { color: var(--kid); }
  .stat .split .who-b {
    background: var(--mom-soft);
    color: var(--mom);
    border-radius: 999px;
    padding: .1em .5em;
  }
  .stat .split .who-k {
    background: var(--kid-soft);
    color: var(--kid);
    border-radius: 999px;
    padding: .1em .5em;
  }
  .stat .sub { font-size: clamp(0.68rem, .72vw, .72rem); font-weight: 600; color: var(--faint); }

  /* ---------- shelf ---------- */
  .shelf-area {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    padding: clamp(10px, 1vw, 16px) clamp(10px, 1vw, 16px) clamp(4px, .5vw, 8px);
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.1vw, 16px);
    transition: background-color .3s ease, border-color .3s ease;
  }
  .shelf { position: relative; padding: 0 clamp(5px, .5vw, 8px); }
  .books { display: flex; align-items: flex-end; gap: var(--gap, 7px); padding: 0 clamp(5px, .5vw, 8px) 7px; }
  .shelf::after {
    content: "";
    display: block;
    height: clamp(11px, 1vw, 15px);
    border-radius: 3px 3px 5px 5px;
    background: linear-gradient(180deg, var(--wood-1) 0%, var(--wood-2) 46%, var(--wood-3) 100%);
    box-shadow: 0 7px 12px rgba(90, 60, 30, .3), inset 0 1px 0 rgba(255, 255, 255, .45),
                inset 0 -2px 3px rgba(0, 0, 0, .22);
  }
  .shelf::before {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: clamp(11px, 1vw, 15px);
    height: 5px;
    background: linear-gradient(180deg, rgba(90, 60, 30, .24), rgba(90, 60, 30, 0));
    border-radius: 3px;
    pointer-events: none;
  }

  .book {
    flex: none;
    width: var(--bw, 88px);
    appearance: none;
    border: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    display: block;
    border-radius: 5px;
    transition: transform .18s ease;
    position: relative;
  }
  .book:hover { transform: translateY(-6px); }
  .book:active { transform: translateY(-2px) scale(.985); }
  .book:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .cover {
    position: relative;
    width: 100%;
    height: calc(var(--bw, 88px) * 1.44);
    border-radius: 3px 6px 6px 3px;
    overflow: hidden;
    background: var(--bg-1);
    box-shadow: var(--book-shadow);
    display: block;
  }
  .cover::after {
    content: "";
    position: absolute;
    inset: 0 0 0 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1), inset -7px 0 9px -3px rgba(0, 0, 0, .16),
                inset 8px 0 8px -6px rgba(255, 255, 255, .5);
    pointer-events: none;
  }
  .cover img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: var(--bg-1);
  }
  /* 표지 이미지가 없거나 깨졌을 때 보이는 책등 스타일 커버 */
  .spine-cover {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: .35em;
    padding: 11% 9% 11% 13%;
    text-align: left;
    color: #3D332A;
    background: var(--spine-bg, linear-gradient(160deg, #F6DCC6 0%, #EBC7A8 100%));
  }
  .spine-cover .sc-title {
    font-size: clamp(0.62rem, .82vw, .74rem);
    font-weight: 800;
    line-height: 1.24;
    letter-spacing: -.01em;
    word-break: keep-all;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .spine-cover .sc-author {
    font-size: clamp(0.54rem, .66vw, .62rem);
    font-weight: 650;
    color: rgba(61, 51, 42, .72);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .spine-cover .sc-rule {
    width: 26px;
    height: 2px;
    border-radius: 2px;
    background: rgba(61, 51, 42, .3);
  }
  .spine-cover::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 7px;
    background: rgba(0, 0, 0, .13);
  }

  .ribbon {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(178, 96, 58, .96), rgba(150, 72, 40, .98));
    color: #FFF6EC;
    font-size: clamp(0.52rem, .64vw, .6rem);
    font-weight: 800;
    letter-spacing: -.01em;
    text-align: center;
    padding: .22em .1em;
    line-height: 1.15;
    box-shadow: 0 -2px 6px rgba(0, 0, 0, .18);
  }
  .ribbon.soon { background: linear-gradient(180deg, rgba(169, 118, 40, .96), rgba(140, 95, 28, .98)); }
  .ribbon.over { background: linear-gradient(180deg, rgba(180, 87, 76, .96), rgba(150, 62, 52, .98)); }
  .star-badge {
    position: absolute;
    top: 5px; right: 5px;
    background: rgba(255, 252, 244, .95);
    color: #8A5A16;
    font-size: clamp(0.55rem, .68vw, .64rem);
    font-weight: 800;
    padding: .12em .38em;
    border-radius: 999px;
    box-shadow: 0 1px 4px rgba(60, 40, 20, .28);
    font-variant-numeric: tabular-nums;
  }
  [data-theme="dark"] .star-badge { background: rgba(35, 30, 26, .94); color: #F0C877; }
  .done-tick {
    position: absolute;
    top: 5px; left: 5px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(91, 122, 82, .95);
    color: #fff;
    font-size: .58rem;
    font-weight: 900;
    display: grid;
    place-items: center;
    box-shadow: 0 1px 4px rgba(30, 40, 25, .35);
  }

  .shelf-empty {
    padding: 26px 10px;
    text-align: center;
    color: var(--faint);
    font-size: .88rem;
    font-weight: 650;
  }
  .foot-note { font-size: clamp(0.68rem, .72vw, .72rem); color: var(--faint); font-weight: 600; padding: 0 4px; }

  /* ---------- modal ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(32, 24, 16, .48);
  }
  .modal[hidden] { display: none; }
  .sheet {
    width: min(470px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .32);
    animation: rise .2s ease;
  }
  @keyframes rise { from { transform: translateY(10px) scale(.985); opacity: .5; } to { transform: none; opacity: 1; } }
  .bm-head { display: flex; align-items: flex-start; gap: 11px; }
  .bm-cover {
    flex: none;
    width: 74px;
    height: 106px;
    border-radius: 3px 6px 6px 3px;
    overflow: hidden;
    position: relative;
    box-shadow: var(--book-shadow);
  }
  .bm-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .bm-cover .spine-cover { padding: 9% 8% 9% 14%; gap: .2em; }
  .bm-cover .spine-cover .sc-title { font-size: .6rem; -webkit-line-clamp: 3; }
  .bm-cover .spine-cover .sc-author, .bm-cover .spine-cover .sc-rule { display: none; }
  .bm-meta { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: .2em; }
  .bm-meta h3 { margin: 0; font-size: clamp(0.98rem, 1vw, 1.04rem); font-weight: 790; line-height: 1.3; letter-spacing: -.01em; word-break: keep-all; }
  .bm-sub { margin: 0; font-size: clamp(0.74rem, .78vw, .78rem); color: var(--soft); font-weight: 620; }
  .bm-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: .18em; }
  .badge {
    font-size: clamp(0.62rem, .68vw, .68rem);
    font-weight: 750;
    padding: .18em .55em;
    border-radius: 999px;
    background: var(--bg-1);
    color: var(--soft);
    white-space: nowrap;
  }
  .badge.mom { background: var(--mom-soft); color: var(--mom); }
  .badge.kid { background: var(--kid-soft); color: var(--kid); }
  .badge.loan { background: var(--amber-soft); color: var(--amber); }
  .badge.shelf { background: var(--green-soft); color: var(--green); }
  .bm-x {
    flex: none;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--faint);
    font-size: .92rem;
    line-height: 1;
    padding: 3px 5px;
    cursor: pointer;
  }
  .bm-x:hover { color: var(--accent); }
  .bm-q {
    margin: 2px 0 0;
    font-size: clamp(0.9rem, .95vw, .95rem);
    font-weight: 780;
    display: flex;
    align-items: center;
    gap: .35em;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--bg-1);
    color: var(--soft);
    border-radius: 11px;
    padding: .58em .5em;
    font-size: clamp(0.8rem, .84vw, .84rem);
    font-weight: 720;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .seg-btn:hover { border-color: var(--accent); color: var(--accent); }
  .seg-btn.on { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 800; }
  .seg-btn[data-ans="reading"].on { background: var(--bg-1); border-color: var(--soft); color: var(--soft); }

  .rate-box { display: flex; flex-direction: column; gap: 5px; }
  .rate-box[hidden] { display: none; }
  .rate-row { display: flex; align-items: center; gap: .5em; flex-wrap: wrap; }
  .rate-label { font-size: clamp(0.78rem, .82vw, .82rem); font-weight: 750; color: var(--soft); }
  .stars { display: flex; gap: 2px; }
  .star {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--line);
    font-size: clamp(1.28rem, 1.5vw, 1.45rem);
    line-height: 1;
    padding: 1px 2px;
    cursor: pointer;
    transition: transform .12s ease, color .12s ease;
  }
  .star:hover { transform: scale(1.12); }
  .star.on { color: #E8A33C; }
  [data-theme="dark"] .star { color: #4A4038; }
  [data-theme="dark"] .star.on { color: #F0BE62; }
  .rate-val { font-size: clamp(0.76rem, .8vw, .8rem); font-weight: 720; color: var(--faint); font-variant-numeric: tabular-nums; }
  .rev-input {
    border: 1px solid var(--line);
    background: var(--bg-1);
    color: var(--text);
    border-radius: 11px;
    padding: .6em .8em;
    font: inherit;
    font-size: clamp(0.84rem, .88vw, .88rem);
  }
  [data-theme="dark"] .rev-input { background: #262220; }
  .rev-input:focus { outline: none; border-color: var(--accent); }
  .bm-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bm-cnt { font-size: .72rem; color: var(--faint); font-weight: 620; }
  .btns { display: flex; gap: 6px; }
  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--soft);
    border-radius: 10px;
    padding: .5em 1em;
    font-size: .84rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--text); border-color: var(--text); color: var(--card); }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(8px);
    background: rgba(48, 38, 28, .93);
    color: #FBF3E7;
    font-size: .8rem;
    font-weight: 700;
    padding: .55em 1em;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, .28);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 70;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 620px) {
    .counters { grid-template-columns: 1fr 1fr; }
    .stat.wide { grid-column: 1 / -1; }
    h1 { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="top">
    <a class="back" href="index.html" aria-label="오늘 보드로 돌아가기">← 오늘 보드</a>
    <h1><span aria-hidden="true">📚</span> 우리 가족 책장</h1>
    <span class="spacer"></span>
    <div class="filters" role="group" aria-label="누구 책 보기">
      <button class="filter on" type="button" data-who="all" aria-pressed="true">전체</button>
      <button class="filter" type="button" data-who="mom" aria-pressed="false">엄마</button>
      <button class="filter" type="button" data-who="kid" aria-pressed="false">은호</button>
    </div>
    <button class="tool" id="themeBtn" type="button" aria-label="다크 모드 전환">
      <span class="ico">🌙</span><span class="lbl">다크모드</span>
    </button>
  </div>

  <div class="counters">
    <div class="stat wide">

  var DEFAULT_DATA = {
    updatedAt: "",
    books: { due: "" },
    shelfBooks: DEFAULT_SHELF
  };

  var DATA = DEFAULT_DATA;
  var REV_KEY = "familyBoard.bookReviews.v1";   /* index.html 과 같은 키 */
  var THEME_KEY = "familyBoard.theme";          /* index.html 과 같은 키 */
  var WHO_KO = { mom: "엄마", kid: "은호" };
  var PASTELS = [
    ["#F6DCC6", "#E9BE9B", "#7A4E2C"],
    ["#E7E2D2", "#CFC6AE", "#5B5340"],
    ["#DCE7DA", "#B8CEB3", "#3F5A3C"],
    ["#E3DEEC", "#C6BEDC", "#4C4260"],
    ["#F7E3E3", "#E6BDBD", "#6B4242"],
    ["#DEE8EF", "#B9CDDC", "#3C4F5E"],
    ["#F4EBCB", "#E2D298", "#6A5A25"],
    ["#EADFE7", "#D3BDCC", "#5C4352"]
  ];

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function load(key) { try { return localStorage.getItem(key); } catch (err) { return null; } }
  function save(key, val) { try { localStorage.setItem(key, val); } catch (err) { /* 저장 안 되면 이번만 */ } }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function parseDate(s) {
    var p = String(s).split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function startOfDay(d) {
    var x = d ? new Date(d) : new Date();
    return new Date(x.getFullYear(), x.getMonth(), x.getDate());
  }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }
  function hash(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
    return h;
  }

  /* ---------- 완독·별점·한 줄평 (브라우저 저장) ---------- */
  var reviews = loadReviews();

  function loadReviews() {
    var raw = load(REV_KEY);
    if (!raw) return {};
    try {
      var o = JSON.parse(raw);
      return (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
    } catch (err) { return {}; }
  }
  function revOf(id) {
    var r = reviews[id];
    return (r && typeof r === "object") ? r : null;
  }
  function thisYear() { return new Date().getFullYear(); }
  function doneYearOf(b) {
    var r = revOf(b.id);
    if (r && r.status === "done") {
      var y = r.at ? new Date(r.at).getFullYear() : thisYear();
      if (y === thisYear()) return thisYear();
    }
    if (String(b.doneYear || "") === String(thisYear())) return thisYear();
    return 0;
  }
  function isDone(b) { return doneYearOf(b) > 0; }
  function ratingOf(b) {
    var r = revOf(b.id);
    return (r && Number(r.rating) > 0) ? Number(r.rating) : 0;
  }
  function reviewOf(b) {
    var r = revOf(b.id);
    return (r && typeof r.review === "string") ? r.review : "";
  }
  function setReview(id, obj) {
    reviews[id] = obj;
    save(REV_KEY, JSON.stringify(reviews));
  }

  /* ---------- 표지 ---------- */
  function spineCover(book, small) {
    var box = el("div", "spine-cover");
    box.setAttribute("aria-hidden", "true");   /* 표지 이미지가 뜨면 읽지 않도록 */
    var p = PASTELS[hash(book.title || "책") % PASTELS.length];
    box.style.background = "linear-gradient(165deg, " + p[0] + " 0%, " + p[1] + " 100%)";
    box.style.color = p[2];
    box.appendChild(el("span", "sc-title", book.title || "제목 없음"));
    if (!small) {
      box.appendChild(el("span", "sc-rule"));
      box.appendChild(el("span", "sc-author", book.author || ""));
    }
    return box;
  }

  function fillCover(box, book, small) {
    box.innerHTML = "";
    box.appendChild(spineCover(book, small));
    if (book.cover) {
      var img = document.createElement("img");
      img.alt = "";
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.addEventListener("error", function () { img.remove(); });   /* 깨진 이미지는 조용히 걷어냄 */
      img.src = book.cover;
      box.appendChild(img);
    }
  }

  function coverEl(book, small) {
    var cover = el("div", small ? "bm-cover" : "cover");
    fillCover(cover, book, small);
    return cover;
  }

  /* 대출 중 책의 반납일은 data.json 의 books.due(매일 갱신)를 우선 사용 */
  function dueOf(book) {
    var shared = (DATA.books && DATA.books.due) || "";
    if (book && book.status === "loan" && shared) return shared;
    return (book && book.due) || shared;
  }

  function ddayLabel(dueIso) {
    if (!dueIso) return "";
    var due = parseDate(dueIso);
    if (isNaN(due.getTime())) return "";
    var left = daysBetween(startOfDay(), due);
    if (left > 0) return "D-" + left;
    if (left === 0) return "D-DAY";
    return "D+" + Math.abs(left);
  }
  function ddayClass(dueIso) {
    if (!dueIso) return "";
    var d = parseDate(dueIso);
    if (isNaN(d.getTime())) return "";
    var left = daysBetween(startOfDay(), d);
    if (left < 0) return "over";
    if (left <= 3) return "soon";
    return "";
  }

  /* ---------- 카운터 ---------- */
  function renderCounters() {
    var books = DATA.shelfBooks || [];
    var doneAll = 0, doneMom = 0, doneKid = 0;
    books.forEach(function (b) {
      if (!isDone(b)) return;
      doneAll++;
      if (b.who === "mom") doneMom++;
      else if (b.who === "kid") doneKid++;
    });
    document.getElementById("doneAll").textContent = doneAll;
    document.getElementById("doneMom").textContent = doneMom;
    document.getElementById("doneKid").textContent = doneKid;

    var loans = books.filter(function (b) { return b.status === "loan"; });
    document.getElementById("loanCount").textContent = loans.length;
    var dues = loans.map(function (b) { return dueOf(b); })
                    .filter(Boolean).sort();
    var soonest = dues.length ? dues[0] : "";
    var dd = document.getElementById("loanDday");
    dd.textContent = soonest ? "· " + ddayLabel(soonest) : "";
    dd.className = "unit " + (ddayClass(soonest) === "over" ? "" : "");
    dd.style.color = ddayClass(soonest) === "over" ? "var(--red)" : "var(--amber)";
    document.getElementById("loanNote").textContent = soonest
      ? (parseDate(soonest).getMonth() + 1) + "월 " + parseDate(soonest).getDate() + "일 반납 예정"
      : "대출 중인 책이 없어요";

    document.getElementById("totalCount").textContent = books.length;
    var momN = books.filter(function (b) { return b.who === "mom"; }).length;
    document.getElementById("totalNote").textContent =
      "엄마 " + momN + "권 · 은호 " + (books.length - momN) + "권";
  }

  /* ---------- 책장 ---------- */
  var filterWho = "all";
  var shelfArea = document.getElementById("shelfArea");

  function orderedBooks() {
    var books = (DATA.shelfBooks || []).filter(function (b) {
      return b && b.title && (filterWho === "all" || b.who === filterWho);
    });
    var rank = { loan: 0, shelf: 1, taken: 2, other: 3, ill: 4, none: 5 };
    return books.map(function (b, i) { return { b: b, i: i }; }).sort(function (x, y) {
      if (filterWho === "all" && x.b.who !== y.b.who) return x.b.who === "mom" ? -1 : 1;
      var rx = rank[x.b.status], ry = rank[y.b.status];
      if (rx == null) rx = 9;
      if (ry == null) ry = 9;
      if (rx !== ry) return rx - ry;
      return x.i - y.i;
    }).map(function (o) { return o.b; });
  }

  function makeBook(book) {
    var btn = el("button", "book");
    btn.type = "button";
    btn.setAttribute("aria-label", book.title + " — 눌러서 완독·별점 남기기");
    btn.title = book.title + (book.author ? " · " + book.author : "");

    var cover = coverEl(book, false);
    btn.appendChild(cover);

    if (book.status === "loan") {
      var due = dueOf(book);
      var rib = el("span", "ribbon " + ddayClass(due), "대출 중" + (due ? " · " + ddayLabel(due) : ""));
      cover.appendChild(rib);
    }
    if (isDone(book)) {
      cover.appendChild(el("span", "done-tick", "✓"));
      var r = ratingOf(book);
      if (r > 0) cover.appendChild(el("span", "star-badge", "★" + r));
    }
    btn.addEventListener("click", function () { openBook(book); });
    return btn;
  }

  function renderShelf() {
    var books = orderedBooks();
    shelfArea.innerHTML = "";
    if (!books.length) {
      shelfArea.appendChild(el("p", "shelf-empty", "아직 이 책장에 꽂힌 책이 없어요."));
      return;
    }

    var areaW = shelfArea.clientWidth || 960;
    var padSide = 2 * Math.round(Math.min(16, Math.max(10, areaW * 0.012)));
    var gap = 7;
    var inner = areaW - padSide - 2 * Math.round(Math.min(8, Math.max(5, areaW * 0.008))) - 2;
    var per = Math.floor((inner + gap) / (76 + gap));
    per = Math.max(3, Math.min(10, per));
    var bw = Math.floor((inner - (per - 1) * gap) / per);
    bw = Math.max(64, Math.min(112, bw));

    shelfArea.style.setProperty("--bw", bw + "px");
    shelfArea.style.setProperty("--gap", gap + "px");

    var i, row, shelf, rowBooks;
    for (i = 0; i < books.length; i += per) {
      rowBooks = books.slice(i, i + per);
      shelf = el("div", "shelf");
      row = el("div", "books");
      rowBooks.forEach(function (book) { row.appendChild(makeBook(book)); });
      shelf.appendChild(row);
      shelfArea.appendChild(shelf);
    }
  }

  /* ---------- 필터 ---------- */
  var filterBtns = document.querySelectorAll(".filter");
  Array.prototype.forEach.call(filterBtns, function (btn) {
    btn.addEventListener("click", function () {
      filterWho = btn.getAttribute("data-who");
      Array.prototype.forEach.call(filterBtns, function (b) {
        var on = b === btn;
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      renderShelf();
    });
  });

  /* ---------- 책 상세 · 완독 팝업 ---------- */
  var modal = document.getElementById("bookModal");
  var bmCover = document.getElementById("bmCover");
  var bmTitle = document.getElementById("bmTitle");
  var bmSub = document.getElementById("bmSub");
  var bmBadges = document.getElementById("bmBadges");
  var rateBox = document.getElementById("rateBox");
  var starsBox = document.getElementById("stars");
  var rateVal = document.getElementById("rateVal");
  var revInput = document.getElementById("revInput");
  var revCnt = document.getElementById("revCnt");
  var segBtns = modal.querySelectorAll(".seg-btn");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  var current = null;        /* 지금 열린 책 */
  var answer = "done";       /* done | reading */
  var draftRating = 0;
  var lastFocus = null;

  function buildStars() {
    starsBox.innerHTML = "";
    for (var n = 1; n <= 5; n++) {
      (function (score) {
        var b = el("button", "star", "★");
        b.type = "button";
        b.setAttribute("data-score", String(score));
        b.setAttribute("aria-label", score + "점");
        b.addEventListener("click", function () {
          draftRating = (draftRating === score) ? 0 : score;
          paintStars();
        });
        starsBox.appendChild(b);
      })(n);
    }
  }

  function paintStars() {
    Array.prototype.forEach.call(starsBox.querySelectorAll(".star"), function (b) {
      var on = Number(b.getAttribute("data-score")) <= draftRating;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    rateVal.textContent = draftRating > 0 ? draftRating + "점" : "—";
  }

  function paintSeg() {
    Array.prototype.forEach.call(segBtns, function (b) {
      var on = b.getAttribute("data-ans") === answer;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    rateBox.hidden = answer !== "done";
    document.getElementById("revCnt").hidden = answer !== "done";
  }

  function openBook(book) {
    current = book;
    lastFocus = document.activeElement;
    answer = "done";
    draftRating = ratingOf(book);
    revInput.value = reviewOf(book);
    revCnt.textContent = revInput.value.length + " / 80";

    fillCover(bmCover, book, true);

    bmTitle.textContent = book.title;
    bmSub.textContent = [book.author, book.publisher].filter(Boolean).join(" · ");

    bmBadges.innerHTML = "";
    bmBadges.appendChild(el("span", "badge " + book.who, WHO_KO[book.who] || "가족"));
    if (book.statusLabel) {
      var bcls = "badge";
      if (book.status === "loan") bcls += " loan";
      else if (book.status === "shelf") bcls += " shelf";
      bmBadges.appendChild(el("span", bcls, book.status === "loan" ? "대출 중" : book.statusLabel));
    }
    if (book.status === "loan") {
      var due = dueOf(book);
      if (due) bmBadges.appendChild(el("span", "badge", "반납 " + (parseDate(due).getMonth() + 1) + "/" + parseDate(due).getDate() + " · " + ddayLabel(due)));
    }

    paintStars();
    paintSeg();
    modal.hidden = false;
    try { document.getElementById("bmOk").focus({ preventScroll: true }); } catch (err) { /* 무시 */ }
  }

  function closeBook() {
    modal.hidden = true;
    current = null;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (err) { /* 무시 */ } }
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  function confirmBook() {
    if (!current) return;
    var book = current;
    if (answer === "done") {
      setReview(book.id, {
        status: "done",
        rating: draftRating,
        review: revInput.value.replace(/\s+$/, ""),
        at: Date.now()
      });
      toast(draftRating > 0 ? "완독 · ★" + draftRating + " 저장했어요" : "완독으로 저장했어요");
    } else {
      setReview(book.id, { status: "reading", rating: 0, review: "", at: Date.now() });
      toast("아직 읽는 중으로 저장했어요");
    }
    closeBook();
    renderCounters();
    renderShelf();
  }

  Array.prototype.forEach.call(segBtns, function (b) {
    b.addEventListener("click", function () {
      answer = b.getAttribute("data-ans");
      paintSeg();
      if (answer === "done") { try { revInput.focus({ preventScroll: true }); } catch (err) { /* 무시 */ } }
    });
  });
  revInput.addEventListener("input", function () {
    revCnt.textContent = revInput.value.length + " / 80";
  });
  document.getElementById("bmOk").addEventListener("click", confirmBook);
  document.getElementById("bmCancel").addEventListener("click", closeBook);
  document.getElementById("bmX").addEventListener("click", closeBook);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeBook(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modal.hidden) closeBook();
    if (e.key === "Enter" && !modal.hidden && document.activeElement === revInput) {
      e.preventDefault();
      confirmBook();
    }
  });

  /* ---------- 테마 (index.html 과 같은 키 공유) ---------- */
  var themeBtn = document.getElementById("themeBtn");
  var themeMeta = document.querySelector('meta[name="theme-color"]');

  function applyTheme(mode) {
    document.documentElement.setAttribute("data-theme", mode);
    var dark = mode === "dark";
    themeBtn.querySelector(".ico").textContent = dark ? "☀️" : "🌙";
    themeBtn.querySelector(".lbl").textContent = dark ? "라이트모드" : "다크모드";
    themeBtn.setAttribute("aria-label", dark ? "라이트 모드로 전환" : "다크 모드로 전환");
    if (themeMeta) themeMeta.setAttribute("content", dark ? "#1B1917" : "#FBF7F0");
  }

  (function initTheme() {
    var saved = load(THEME_KEY);
    if (saved === "dark" || saved === "light") applyTheme(saved);
    else {
      var h = new Date().getHours();
      applyTheme(h >= 20 || h < 7 ? "dark" : "light");
    }
  })();

  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    save(THEME_KEY, next);
  });

  /* ---------- data.json 불러오기 ---------- */
  function boot() {
    buildStars();
    paintStars();
    renderCounters();
    renderShelf();
  }
  boot();

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderShelf, 160);
  });

  (function fetchData() {
    if (typeof fetch !== "function") return;
    fetch("./data.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (json) {
        if (!json || typeof json !== "object") throw new Error("형식이 올바르지 않음");
        if (Array.isArray(json.shelfBooks) && json.shelfBooks.length) {
          DATA = {
            updatedAt: json.updatedAt || "",
            books: (json.books && typeof json.books === "object") ? json.books : { due: "" },
            shelfBooks: json.shelfBooks
          };
        } else if (json.books && typeof json.books === "object") {
          DATA.books = json.books;      /* 책 목록은 기본값 유지, 반납일만 갱신 */
        }
        reviews = loadReviews();
        renderCounters();
        renderShelf();
      })
      .catch(function (err) {
        try { console.warn("data.json 을 불러오지 못해 기본 책장으로 표시합니다:", err && err.message); } catch (e) { /* 무시 */ }
      });
  })();

  /* 자정을 넘기면 D-day 를 새로 계산 */
  var lastDay = new Date().getDate();
  setInterval(function () {
    var d = new Date().getDate();
    if (d !== lastDay) {
      lastDay = d;
      renderCounters();
      renderShelf();
    }
  }, 60000);
})();
</script>
</body>
</html>
