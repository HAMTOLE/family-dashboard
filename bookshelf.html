<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<title>📚 은호의 책장</title>
<meta name="robots" content="noindex">
<!--
  책장은 이제 index.html 안에 들어 있어 페이지를 옮기지 않는다(전체화면이 풀리지 않도록).
  예전 주소로 들어온 경우에는 같은 화면의 책장 뷰로 바로 넘긴다.
-->
<link rel="canonical" href="./index.html">
<script>
  (function () {
    "use strict";
    try {
      var saved = localStorage.getItem("familyBoard.theme");
      var h = new Date().getHours();
      var mode = (saved === "dark" || saved === "light") ? saved : (h >= 20 || h < 7 ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", mode);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", mode === "dark" ? "#1B1917" : "#FBF7F0");
    } catch (err) { /* 무시 */ }
  })();
  location.replace("./index.html#shelf");
</script>
<style>
  :root {
    --bg: #FBF7F0; --card: #FFFDF9; --line: #EADFCF; --text: #3B342C; --soft: #7A6F62; --accent: #B5794F;
  }
  [data-theme="dark"] {
    --bg: #1B1917; --card: #232020; --line: #3A342D; --text: #EDE5D8; --soft: #B3A796; --accent: #DDA57C;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", "Noto Sans KR", sans-serif;
    display: grid;
    place-items: center;
    text-align: center;
    gap: 10px;
    padding: 24px;
  }
  .box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 26px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  h1 { margin: 0; font-size: 1.2rem; font-weight: 790; letter-spacing: -.02em; }
  p { margin: 0; font-size: .86rem; color: var(--soft); font-weight: 620; }
  a { color: var(--accent); font-weight: 750; text-decoration: none; border-bottom: 1px solid currentColor; }
</style>
<noscript><meta http-equiv="refresh" content="0; url=./index.html#shelf"></noscript>
</head>
<body>
  <div class="box">
    <h1>📚 은호의 책장</h1>
    <p>오늘 보드 안의 책장으로 이동하고 있어요…</p>
    <p><a href="./index.html#shelf">바로 열기</a></p>
  </div>
</body>
</html>
