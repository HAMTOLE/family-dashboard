<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>1024x768 확인용 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#222;}
  #f{width:1024px;height:768px;border:0;display:block;background:#fff;}
</style>
</head>
<body>
<iframe id="f" src="./index.html"></iframe>
<pre id="out" style="color:#fff;font:12px monospace;margin:4px"></pre>
<script>
  var frame = document.getElementById("f");
  var out = document.getElementById("out");
  var errs = [];
  frame.addEventListener("load", function () {
    var w = frame.contentWindow, d = frame.contentDocument;
    w.addEventListener("error", function (e) { errs.push(String(e.message)); });
    setTimeout(function () {
      var doc = d.scrollingElement || d.documentElement;
      var res = {
        viewport: [w.innerWidth, w.innerHeight],
        pageScrollH: doc.scrollHeight,
        pageScrollW: doc.scrollWidth,
        needsScrollY: doc.scrollHeight > w.innerHeight + 1,
        needsScrollX: doc.scrollWidth > w.innerWidth + 1,
        errors: errs
      };
      var over = [];
      d.querySelectorAll("main .region, .region, section").forEach(function (el) {
        if (el.scrollHeight > el.clientHeight + 1) {
          over.push((el.querySelector("h2,h3") || el).textContent.trim().slice(0, 30) + ":" + el.scrollHeight + "/" + el.clientHeight);
        }
        if (el.scrollWidth > el.clientWidth + 1) {
          over.push("W " + (el.querySelector("h2,h3") || el).textContent.trim().slice(0, 30) + ":" + el.scrollWidth + "/" + el.clientWidth);
        }
      });
      res.overflowingCards = over;
      out.textContent = JSON.stringify(res);
    }, 1500);
  });
</script>
</body>
</html>
